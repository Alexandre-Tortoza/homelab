services:

  # ── Actual Budget ──────────────────────────────────────────────────────────
  actual-budget:
    image: ${ACTUAL_IMAGE:-actualbudget/actual-server:25.7.1}
    container_name: homelab-actual
    restart: unless-stopped
    volumes:
      - ${DATA_DIR}/actual/data:/data
    networks:
      - homelab
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5006/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      sablier.enable: "true"
      sablier.group: actual
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

networks:
  homelab:
    external: true
