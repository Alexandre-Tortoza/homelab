services:

  # ── Reverse proxy + TLS (sempre ativo) ────────────────────────────────────
  caddy:
    build:
      context: ../caddy
      dockerfile: Dockerfile
    image: ${CADDY_IMAGE:-homelab-caddy:local}
    pull_policy: build
    container_name: homelab-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR}/caddy/data:/data
      - ${DATA_DIR}/caddy/config:/config
    networks:
      - homelab
    depends_on:
      - sablier
    environment:
      HOMELAB_DOMAIN: ${HOMELAB_DOMAIN:-homelab}
      GITEA_SESSION_DURATION: ${GITEA_SESSION_DURATION:-30m}
      VAULTWARDEN_SESSION_DURATION: ${VAULTWARDEN_SESSION_DURATION:-10m}
      LINKWARDEN_SESSION_DURATION: ${LINKWARDEN_SESSION_DURATION:-30m}
      ACTUAL_SESSION_DURATION: ${ACTUAL_SESSION_DURATION:-30m}
      MEALIE_SESSION_DURATION: ${MEALIE_SESSION_DURATION:-30m}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ── Scale-to-zero manager (sempre ativo) ──────────────────────────────────
  sablier:
    image: ${SABLIER_IMAGE:-sablierapp/sablier:1.16.1}
    container_name: homelab-sablier
    restart: unless-stopped
    command: start --provider.name=docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - homelab
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"

  # ── DNS interno para a tailnet (sempre ativo) ──────────────────────────────
  coredns:
    image: ${COREDNS_IMAGE:-coredns/coredns:1.12.1}
    container_name: homelab-coredns
    restart: unless-stopped
    command: ["-conf", "/Corefile"]
    ports:
      - "${TAILSCALE_IP}:53:53/tcp"
      - "${TAILSCALE_IP}:53:53/udp"
    volumes:
      - ../Corefile:/Corefile:ro
    networks:
      - homelab
    environment:
      TAILSCALE_IP: ${TAILSCALE_IP}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"

  # ── Dashboard ──────────────────────────────────────────────────────────────
  homepage:
    image: ${HOMEPAGE_IMAGE:-ghcr.io/gethomepage/homepage:v1.7.0}
    container_name: homelab-homepage
    restart: unless-stopped
    volumes:
      - ../homepage:/app/config
    networks:
      - homelab
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "home.${HOMELAB_DOMAIN:-homelab}"
      HOMEPAGE_VAR_HOMELAB_DOMAIN: ${HOMELAB_DOMAIN:-homelab}
      TZ: ${TZ:-America/Sao_Paulo}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.3"

networks:
  homelab:
    external: true
