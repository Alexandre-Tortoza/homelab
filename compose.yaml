services:

  # ── Reverse proxy + TLS (sempre ativo) ────────────────────────────────────
  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    image: ${CADDY_IMAGE:-homelab-caddy:local}
    pull_policy: build
    container_name: homelab-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/homelab/caddy/data:/data
      - /srv/homelab/caddy/config:/config
    networks:
      - homelab
    depends_on:
      - sablier
    environment:
      TAILSCALE_MACHINE: ${TAILSCALE_MACHINE}
      GITEA_SESSION_DURATION: ${GITEA_SESSION_DURATION:-30m}
      VAULTWARDEN_SESSION_DURATION: ${VAULTWARDEN_SESSION_DURATION:-10m}
      LINKWARDEN_SESSION_DURATION: ${LINKWARDEN_SESSION_DURATION:-30m}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ── Scale-to-zero manager (sempre ativo) ──────────────────────────────────
  sablier:
    image: ${SABLIER_IMAGE:-sablierapp/sablier:1.16.1}
    container_name: homelab-sablier
    restart: unless-stopped
    command: start --provider.name=docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - homelab
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"

  # ── DNS interno para a tailnet (sempre ativo) ──────────────────────────────
  adguard:
    image: ${ADGUARD_IMAGE:-adguard/adguardhome:v0.107.78}
    container_name: homelab-adguard
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP}:53:53/tcp"
      - "${TAILSCALE_IP}:53:53/udp"
      - "${TAILSCALE_IP}:3080:80/tcp"   # Admin UI via Tailscale
    volumes:
      - /srv/homelab/adguard/work:/opt/adguardhome/work
      - /srv/homelab/adguard/conf:/opt/adguardhome/conf
    networks:
      - homelab
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"

  # ── Gitea ──────────────────────────────────────────────────────────────────
  gitea:
    image: ${GITEA_IMAGE:-gitea/gitea:1.27.1}
    container_name: homelab-gitea
    restart: unless-stopped
    ports:
      - "${GITEA_SSH_PORT:-2222}:22"
    volumes:
      - /srv/homelab/gitea/data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - homelab
    environment:
      USER_UID: ${PUID:-1000}
      USER_GID: ${PGID:-1000}
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: ${GITEA_DB_NAME:-gitea}
      GITEA__database__USER: ${GITEA_DB_USER:-gitea}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD}
      GITEA__server__ROOT_URL: "https://git.${TAILSCALE_MACHINE}.ts.net"
      GITEA__server__DOMAIN: "git.${TAILSCALE_MACHINE}.ts.net"
      GITEA__server__SSH_DOMAIN: "${TAILSCALE_MACHINE}.ts.net"
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
      GITEA__server__SSH_LISTEN_PORT: "22"
      GITEA__server__LFS_START_SERVER: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__packages__ENABLED: "true"
      GITEA__log__LEVEL: Warn
      TZ: ${TZ:-America/Sao_Paulo}
    depends_on:
      gitea-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    labels:
      sablier.enable: "true"
      sablier.group: gitea
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  gitea-db:
    image: ${GITEA_DB_IMAGE:-postgres:18.4-alpine}
    container_name: homelab-gitea-db
    restart: unless-stopped
    volumes:
      - /srv/homelab/gitea/postgres:/var/lib/postgresql
    networks:
      - homelab
    environment:
      POSTGRES_DB: ${GITEA_DB_NAME:-gitea}
      POSTGRES_USER: ${GITEA_DB_USER:-gitea}
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD}
      TZ: ${TZ:-America/Sao_Paulo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      sablier.enable: "true"
      sablier.group: gitea
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ── Vaultwarden ───────────────────────────────────────────────────────────
  vaultwarden:
    image: ${VAULTWARDEN_IMAGE:-vaultwarden/server:1.37.1}
    container_name: homelab-vaultwarden
    restart: unless-stopped
    volumes:
      - /srv/homelab/vaultwarden/data:/data
    networks:
      - homelab
    environment:
      DOMAIN: "https://vault.${TAILSCALE_MACHINE}.ts.net"
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      WEBSOCKET_ENABLED: "true"
      TZ: ${TZ:-America/Sao_Paulo}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      sablier.enable: "true"
      sablier.group: vaultwarden
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ── Linkwarden ────────────────────────────────────────────────────────────
  linkwarden:
    image: ${LINKWARDEN_IMAGE:-ghcr.io/linkwarden/linkwarden:v2.8.4}
    container_name: homelab-linkwarden
    restart: unless-stopped
    volumes:
      - /srv/homelab/linkwarden/data:/data/data
    networks:
      - homelab
    environment:
      DATABASE_URL: postgresql://${LINKWARDEN_DB_USER:-linkwarden}:${LINKWARDEN_DB_PASSWORD}@linkwarden-db:5432/${LINKWARDEN_DB_NAME:-linkwarden}
      NEXTAUTH_SECRET: ${LINKWARDEN_NEXTAUTH_SECRET}
      NEXTAUTH_URL: "https://links.${TAILSCALE_MACHINE}.ts.net"
      DISABLE_REGISTRATION: ${LINKWARDEN_DISABLE_REGISTRATION:-true}
      NEXT_PUBLIC_DISABLE_REGISTRATION: ${LINKWARDEN_DISABLE_REGISTRATION:-true}
      TZ: ${TZ:-America/Sao_Paulo}
    depends_on:
      linkwarden-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      sablier.enable: "true"
      sablier.group: linkwarden
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  linkwarden-db:
    image: ${LINKWARDEN_DB_IMAGE:-postgres:18.4-alpine}
    container_name: homelab-linkwarden-db
    restart: unless-stopped
    volumes:
      - /srv/homelab/linkwarden/postgres:/var/lib/postgresql
    networks:
      - homelab
    environment:
      POSTGRES_DB: ${LINKWARDEN_DB_NAME:-linkwarden}
      POSTGRES_USER: ${LINKWARDEN_DB_USER:-linkwarden}
      POSTGRES_PASSWORD: ${LINKWARDEN_DB_PASSWORD}
      TZ: ${TZ:-America/Sao_Paulo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      sablier.enable: "true"
      sablier.group: linkwarden
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

networks:
  homelab:
    name: homelab
    driver: bridge
